name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 4 попытки в час вдали от часового пика GitHub (пропуски идут в минуты :00):
    - cron: "10,40 * * * *"   # в :10 и :40 — обновление каждые полчаса
    - cron: "25,55 * * * *"   # страховочные попытки в :25 и :55
  workflow_dispatch: {}      # кнопка «Run workflow» для ручного запуска

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true   # новый запуск отменяет заснувший — цепочка не копится

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/configure-pages@v5

      - name: Обновить данные из ВК
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          VK_GROUP: online_tyumen72
        run: node scripts/fetch-vk.mjs

      - run: bun install

      - name: Определить basePath
        id: basepath
        run: |
          # Личная страница username.github.io живёт в корне — префикс пустой.
          # Проектный сайт username.github.io/repo — префикс "/repo".
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Статический экспорт
        env:
          NEXT_EXPORT: "1"
          NEXT_BASE_PATH: ${{ steps.basepath.outputs.path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.path }}
        run: bun next build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Полная автоматика: сайт сам себя будит. Каждый цикл после выкладки
  # ждёт паузу и запускает следующий цикл через API — по кругу 24/7.
  # Расписание (schedule) и ваши посты остаются страховкой и ускорением.
  keepalive:
    name: Будильник следующего цикла
    needs: [build, deploy]
    if: ${{ !cancelled() }}   # идёт даже при сбое сборки; не идёт только при отмене
    runs-on: ubuntu-latest
    steps:
      - name: Пауза до следующего обновления (12 минут)
        run: sleep 720

      - name: Запланировать следующий цикл
        env:
          LOOP_TOKEN: ${{ secrets.LOOP_PAT }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: token $LOOP_TOKEN" \
              https://api.github.com/repos/huaggalses/VK/actions/workflows/nextjs.yml/dispatches \
              -d '{"ref":"main"}')
            if [ "$code" = "204" ]; then
              echo "✓ следующий цикл запланирован — лента обновится через ~15 минут"
              exit 0
            fi
            echo "попытка $i → HTTP $code, повтор через 30 секунд"
            sleep 30
          done
          echo "⚠ не удалось запланировать следующий цикл — подстрахует расписание"
