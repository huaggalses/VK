name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/45 * * * *"   # подтягивать новые посты из ВК каждые 45 минут
  workflow_dispatch: {}      # кнопка «Run workflow» для ручного запуска

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/configure-pages@v5

      - name: Обновить данные из ВК
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          VK_GROUP: online_tyumen72
        run: node scripts/fetch-vk.mjs

      - run: bun install

      - name: Определить basePath
        id: basepath
        run: |
          # Личная страница username.github.io живёт в корне — префикс пустой.
          # Проектный сайт username.github.io/repo — префикс "/repo".
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Статический экспорт
        env:
          NEXT_EXPORT: "1"
          NEXT_BASE_PATH: ${{ steps.basepath.outputs.path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.path }}
        run: bun next build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
